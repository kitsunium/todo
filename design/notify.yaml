# The reminders: a mail to the owner of a task due soon, once.
apiVersion: design/v2
domains:
  - name: notify
    description: The mails the product sends, the reminders of what is due soon.
    components:
      - name: reminders
        role: application
        code: 64.3.1
        uses: [planner, task]
        description: Who is reminded of what, and what that needs.
        evidence: [legacy-product]
        values:
          - name: Mail
            description: A mail, as plain text.
            fields:
              - {name: To, type: string, tag: 'json:"to" app:"personal"'}
              - {name: Subject, type: string, tag: 'json:"subject" app:"public"'}
              - {name: Body, type: string, tag: 'json:"body" app:"personal"'}
        ports:
          - name: Mailer
            direction: out
            version: 1
            description: MailerV1 sends a mail.
            methods:
              - {name: Send, params: [{name: m, type: Mail}]}
          - name: Directory
            direction: out
            version: 1
            description: DirectoryV1 gives the address a member is written to.
            methods:
              - {name: Address, params: [{name: userID, type: string}], results: [{type: string}, {type: bool}]}
          - name: ReminderLog
            direction: out
            version: 1
            description: ReminderLogV1 remembers which tasks were reminded of, so each is once.
            methods:
              - {name: Seen, params: [{name: taskID, type: string}], results: [{type: bool}]}
              - {name: Mark, params: [{name: taskID, type: string}]}
        usecases:
          - name: RemindDue
            description: RemindDue mails the owner of each open task due within a delay, once per task.
            input:
              - {name: Within, type: time.Duration}
            output:
              - {name: Sent, type: int}
            calls: [tasks/usecase/DueSoon, notify/port/ReminderLog@v1.Seen, notify/port/Directory@v1.Address, notify/port/Mailer@v1.Send, notify/port/ReminderLog@v1.Mark]
            scenarios:
              - {name: mails each task due soon once, kind: success}
              - {name: skips a task whose owner is gone, kind: success}
        internals:
          functions:
            - name: reminder
              description: "reminder is the mail a task due soon is reminded of with."
              params: [{name: t, type: "task.Task"}, {name: to, type: "string"}]
              results: [{type: "Mail"}]
      - name: post
        role: adapter
        code: 64.3.4
        uses: [reminders]
        description: The product's mailer, its durable outbox and its transport, and the command every component that writes to a member sends through.
        values:
          - name: Letter
            description: A mail to one member, as plain text.
            fields:
              - {name: To, type: string, tag: 'json:"to" app:"personal"'}
              - {name: Name, type: string, tag: 'json:"name" app:"personal"', description: "Name is the recipient's, beside the address; it may be empty."}
              - {name: Subject, type: string, tag: 'json:"subject" app:"public"'}
              - {name: Body, type: string, tag: 'json:"body" app:"personal"'}
          - name: Posted
            description: A mail the outbox took.
            fields:
              - {name: ID, type: string, tag: 'json:"id" app:"public"'}
        mailers:
          - {name: mail, from: {name: Todo, address: hello@todo.localhost}}
        commands:
          - {name: send, input: Letter, output: Posted, handler: Send, description: "Puts a mail in the outbox: the one path every mail of the product takes."}
        adapters:
          - name: Carrier
            description: Carrier is Mailer@v1 on the mailer "mail".
            implements: [notify/port/Mailer@v1]
            connections:
              - {name: smtp-submission, description: "The server hands each mail to the deployment's SMTP relay.", transport: tcp, side: dials, port: 587, to: "system:mail-relay", security: starttls, frames: [Mail]}
        internals:
          functions:
            - name: post
              description: "post puts a letter in the mailer's outbox, which delivers it, tries again when the relay refuses it, and only captures it when the deployment names no relay."
              params: [{name: ctx, type: "context.Context"}, {name: l, type: "Letter"}]
              results: [{type: "Posted"}, {type: "error"}]
      - name: outbox
        role: adapter
        code: 64.3.2
        uses: [reminders, vault]
        description: The log of the reminders, and the directory they ask.
        entities:
          - name: Reminded
            description: A task its owner was reminded of.
            fields:
              - {name: TaskID, type: string, tag: 'json:"taskId" app:"public"'}
              - {name: At, type: time.Time, tag: 'json:"at" app:"public"'}
        stores:
          - {name: reminded, entity: Reminded, key: TaskID, description: The tasks already reminded of.}
        adapters:
          - name: Members
            description: Members is Directory@v1 on the identity's query "member".
            implements: [notify/port/Directory@v1]
          - name: Ledger
            description: Ledger is ReminderLog@v1 on the store "reminded".
            implements: [notify/port/ReminderLog@v1]
      - name: watch
        role: presentation
        code: 64.3.3
        uses: [reminders]
        description: The job that sends the reminders.
        settings:
          - {name: remind-within, type: duration, default: 24h, description: How long before its due date a task's owner is reminded.}
        jobs:
          - {name: remind-due, every: 1m, handler: Remind, description: Reminds the owners of the tasks due within remind-within., uses: [notify/usecase/RemindDue, "setting:remind-within"], calls: [notify/usecase/RemindDue]}
    sequences:
      - name: remind-due
        description: The server reminds a member of a task of theirs due soon.
        start: notify/usecase/RemindDue
        steps:
          - call: notify/port/ReminderLog@v1.Seen
          - call: notify/port/Directory@v1.Address
          - call: notify/port/Mailer@v1.Send
          - call: notify/port/ReminderLog@v1.Mark
