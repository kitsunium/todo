# The activity: what happened to the tasks, as a feed.
apiVersion: design/v2
domains:
  - name: activity
    description: What happened to a member's tasks, newest first.
    components:
      - name: feed
        role: adapter
        code: 64.2.1
        uses: [taskstore]
        description: The feed, written from the tasks' events, and its HTTP read.
        evidence: [legacy-product]
        entities:
          - name: Entry
            description: One thing that happened to a task.
            fields:
              - {name: ID, type: string, tag: 'json:"id" app:"public"'}
              - {name: Seq, type: int64, tag: 'json:"seq" app:"public"', description: "Seq orders the entries: each is one above the entry written before it."}
              - {name: UserID, type: string, tag: 'json:"userId" app:"public"', description: "UserID is the member whose feed the entry is in: the task's owner."}
              - {name: Kind, type: string, tag: 'json:"kind" app:"public"', description: "Kind is added, or the lifecycle event that moved the task."}
              - {name: TaskID, type: string, tag: 'json:"taskId" app:"public"'}
              - {name: Title, type: string, tag: 'json:"title" app:"public"'}
              - {name: Assignee, type: string, tag: 'json:"assignee" app:"personal,subject"'}
              - {name: At, type: time.Time, tag: 'json:"at" app:"public"'}
        values:
          - name: Page
            description: The latest entries, newest first.
            fields:
              - {name: Entries, type: "[]Entry", tag: 'json:"entries"'}
          - name: PageRequest
            description: How many entries to read.
            fields:
              - {name: Limit, type: int, tag: 'query:"limit"'}
        constants:
          - {name: Keep, type: int, value: "200", description: Keep is how many entries the feed keeps for a member.}
        stores:
          - name: entries
            entity: Entry
            key: ID
            description: "The feed's entries, keyed by the id of the event each one tells; an entry is deleted ninety days after it was written."
            deleteAfter: {delay: 2160h, since: At}
        subscriptions:
          - {name: tasks, topic: tasks/topic/events, handler: Record}
        endpoints:
          - {route: "GET /api/activity", request: PageRequest, response: Page, handler: Recent, auth: required}
