# The tasks: what a task is, what the team does with one, where they are
# kept and the HTTP API in front of them.
apiVersion: design/v2
domains:
  - name: tasks
    description: What the team has to do, who does it and by when.
    components:
      - name: task
        role: domain
        code: 64.1.1
        description: The task, its priority and its lifecycle.
        evidence: [legacy-product]
        entities:
          - name: Task
            description: Something to do, for someone, by a date.
            fields:
              - {name: ID, type: string, tag: 'json:"id" app:"public"'}
              - {name: OwnerID, type: string, tag: 'json:"ownerId" app:"public"', description: "OwnerID is the member whose task it is: who added it, shares it and deletes it."}
              - {name: SharedWith, type: "[]string", tag: 'json:"sharedWith" app:"public"', description: "SharedWith are the members the owner shares the task with: they see it, edit it and move it."}
              - {name: Title, type: string, tag: 'json:"title" app:"public"'}
              - {name: Notes, type: string, tag: 'json:"notes" app:"public"'}
              - {name: Priority, type: Priority, tag: 'json:"priority" app:"public"'}
              - {name: Assignee, type: string, tag: 'json:"assignee" app:"personal"', description: "Assignee is who does the task, as the team names them; an address gets the reminders."}
              - {name: Due, type: time.Time, tag: 'json:"due" app:"public"', description: "Due is when the task is due; the zero time when it has no date."}
              - {name: State, type: LifecycleState, tag: 'json:"state" app:"public"'}
              - {name: CreatedAt, type: time.Time, tag: 'json:"createdAt" app:"public"'}
              - {name: UpdatedAt, type: time.Time, tag: 'json:"updatedAt" app:"public"'}
              - {name: DoneAt, type: time.Time, tag: 'json:"doneAt" app:"public"', description: "DoneAt is when the task was last completed; the zero time while it is open."}
            methods:
              - name: SeenBy
                description: SeenBy reports whether a member sees the task, its owner or one it is shared with.
                params: [{name: user, type: string}]
                results: [{type: bool}]
                properties: [OwnerAndSharedOnly]
              - name: Overdue
                description: Overdue reports whether the task is still open after its due date.
                params: [{name: now, type: time.Time}]
                results: [{type: bool}]
                properties: [NeverWhenDone]
        values:
          - name: Priority
            description: How urgent a task is.
            underlying: string
        constants:
          - {name: MaxTitle, type: int, value: "120", description: MaxTitle is the longest title a task takes.}
          - {name: PriorityLow, type: Priority, value: '"low"', description: PriorityLow is what can wait.}
          - {name: PriorityNormal, type: Priority, value: '"normal"', description: PriorityNormal is the priority of a task that names none.}
          - {name: PriorityHigh, type: Priority, value: '"high"', description: PriorityHigh is what comes first.}
        functions:
          - name: ParsePriority
            description: ParsePriority reads a priority as a member writes it; an empty one is normal.
            params: [{name: s, type: string}]
            results: [{type: Priority}, {type: error}]
            properties: [KnownOrRefused]
        errors:
          - {name: ErrEmptyTitle, serial: 1, message: a task needs a title}
          - {name: ErrTitleTooLong, serial: 2, message: a title is 120 characters at most}
          - {name: ErrNotFound, serial: 3, message: no such task}
          - {name: ErrUnknownPriority, serial: 4, message: "a priority is low, normal or high"}
          - {name: ErrNotAllowed, serial: 5, message: the task cannot make this move from the state it is in}
          - {name: ErrNotContact, serial: 6, message: a task is shared with a contact of its owner}
          - {name: ErrNotOwner, serial: 7, message: only its owner does this to a task}
        workflows:
          - name: Lifecycle
            entity: Task
            description: A task is open, then done, then archived; a done one reopens, an archived one is restored.
            states: [open, done, archived]
            initial: open
            transitions:
              - {event: complete, from: [open], to: done}
              - {event: reopen, from: [done], to: open}
              - {event: archive, from: [done], to: archived}
              - {event: restore, from: [archived], to: open}
      - name: planner
        role: application
        code: 64.1.2
        uses: [task]
        description: What the team does with tasks, and what that needs.
        ports:
          - name: TaskStore
            direction: out
            version: 1
            description: TaskStoreV1 keeps the tasks.
            methods:
              - {name: NewID, results: [{type: string}]}
              - {name: Save, params: [{name: t, type: task.Task}]}
              - {name: Get, params: [{name: id, type: string}], results: [{type: task.Task}]}
              - {name: List, results: [{type: "[]task.Task"}]}
              - {name: Delete, params: [{name: id, type: string}]}
          - name: Circle
            direction: out
            version: 1
            description: CircleV1 says who is a contact of whom.
            methods:
              - {name: AreContacts, params: [{name: one, type: string}, {name: other, type: string}], results: [{type: bool}]}
          - name: Clock
            direction: out
            version: 1
            description: ClockV1 tells the time.
            methods:
              - {name: Now, results: [{type: time.Time}]}
          - name: Journal
            direction: out
            version: 1
            description: JournalV1 is told what happened to a task, for whoever keeps a feed of it.
            methods:
              - {name: Record, params: [{name: kind, type: string}, {name: t, type: task.Task}]}
        usecases:
          - name: AddTask
            description: AddTask adds an open task to its owner's list.
            input:
              - {name: Owner, type: string}
              - {name: Title, type: string}
              - {name: Notes, type: string}
              - {name: Priority, type: string}
              - {name: Assignee, type: string}
              - {name: Due, type: time.Time}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrEmptyTitle, task.ErrTitleTooLong, task.ErrUnknownPriority]
            calls: [tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.NewID, tasks/port/TaskStore@v1.Save, tasks/port/Journal@v1.Record]
            scenarios:
              - {name: adds an open task, kind: success}
              - {name: refuses an empty title, kind: refusal, error: task.ErrEmptyTitle}
              - {name: refuses a long title, kind: refusal, error: task.ErrTitleTooLong}
              - {name: refuses an unknown priority, kind: refusal, error: task.ErrUnknownPriority}
          - name: MoveTask
            description: MoveTask moves a task through its lifecycle by one event (complete, reopen, archive, restore), for a member who sees it; a task they do not see is not found.
            input:
              - {name: Owner, type: string}
              - {name: ID, type: string}
              - {name: Event, type: string}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrNotFound, task.ErrNotAllowed]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.Save, tasks/port/Journal@v1.Record]
            scenarios:
              - {name: completes an open task, kind: success}
              - {name: refuses an unknown task, kind: refusal, error: task.ErrNotFound}
              - {name: refuses the task of another member, kind: refusal, error: task.ErrNotFound}
              - {name: moves a task shared with the member, kind: success}
              - {name: refuses to archive an open task, kind: refusal, error: task.ErrNotAllowed}
          - name: ListTasks
            description: ListTasks lists the tasks a member sees, theirs and those shared with them, of a state, or every one not archived, the most urgent first.
            input:
              - {name: Owner, type: string}
              - {name: State, type: string}
            output:
              - {name: Tasks, type: "[]task.Task"}
            calls: [tasks/port/TaskStore@v1.List]
            scenarios:
              - {name: lists the most urgent first, kind: success}
          - name: GetTask
            description: GetTask reads one task, for a member who sees it.
            input:
              - {name: User, type: string}
              - {name: ID, type: string}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrNotFound]
            calls: [tasks/port/TaskStore@v1.Get]
            scenarios:
              - {name: reads a task shared with the member, kind: success}
              - {name: refuses a task the member does not see, kind: refusal, error: task.ErrNotFound}
          - name: EditTask
            description: EditTask changes what a task says, its title, notes, priority, assignee or due date, each only when given, for a member who sees it.
            input:
              - {name: User, type: string}
              - {name: ID, type: string}
              - {name: Title, type: "*string"}
              - {name: Notes, type: "*string"}
              - {name: Priority, type: "*string"}
              - {name: Assignee, type: "*string"}
              - {name: Due, type: "*time.Time"}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrNotFound, task.ErrEmptyTitle, task.ErrTitleTooLong, task.ErrUnknownPriority]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.Save, tasks/port/Journal@v1.Record]
            scenarios:
              - {name: changes only what is given, kind: success}
              - {name: refuses an empty title, kind: refusal, error: task.ErrEmptyTitle}
          - name: DeleteTask
            description: DeleteTask deletes a task, for its owner alone.
            input:
              - {name: User, type: string}
              - {name: ID, type: string}
            errors: [task.ErrNotFound, task.ErrNotOwner]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/TaskStore@v1.Delete, tasks/port/Journal@v1.Record]
            scenarios:
              - {name: deletes a task of the owner, kind: success}
              - {name: refuses a member it is shared with, kind: refusal, error: task.ErrNotOwner}
          - name: ShareTask
            description: ShareTask shares a task with a contact of its owner, who then sees it.
            input:
              - {name: User, type: string}
              - {name: ID, type: string}
              - {name: With, type: string}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrNotFound, task.ErrNotOwner, task.ErrNotContact]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/Circle@v1.AreContacts, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.Save, tasks/port/Journal@v1.Record]
            scenarios:
              - {name: shares with a contact, kind: success}
              - {name: refuses who is no contact, kind: refusal, error: task.ErrNotContact}
              - {name: refuses who is not the owner, kind: refusal, error: task.ErrNotOwner}
          - name: UnshareTask
            description: UnshareTask ends the sharing of a task with a member, for its owner, or for that member who leaves it.
            input:
              - {name: User, type: string}
              - {name: ID, type: string}
              - {name: With, type: string}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrNotFound, task.ErrNotOwner]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.Save]
            scenarios:
              - {name: lets a member leave a task, kind: success}
              - {name: refuses a member who removes another, kind: refusal, error: task.ErrNotOwner}
          - name: CountTasks
            description: CountTasks counts the tasks per state, and the open ones past their due date.
            output:
              - {name: Counts, type: "map[string]int"}
              - {name: Total, type: int}
              - {name: Overdue, type: int}
            calls: [tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.List]
            scenarios:
              - {name: counts every state, kind: success}
          - name: DueSoon
            description: DueSoon lists the open tasks due within a delay, the soonest first.
            input:
              - {name: Within, type: time.Duration}
            output:
              - {name: Tasks, type: "[]task.Task"}
            calls: [tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.List]
            scenarios:
              - {name: lists the open tasks due soon, kind: success}
        internals:
          functions:
            - name: move
              description: "move fires event on t at now and stamps what the move changes: the state, UpdatedAt, and DoneAt, set when the task is completed and cleared when it opens again."
              params: [{name: ctx, type: "context.Context"}, {name: t, type: "*task.Task"}, {name: event, type: "task.LifecycleEvent"}, {name: now, type: "time.Time"}]
              results: [{type: "error"}]
            - name: rank
              description: "rank orders the priorities, the most urgent first."
              params: [{name: p, type: "task.Priority"}]
              results: [{type: "int"}]
            - name: byUrgency
              description: "byUrgency orders two tasks: the higher priority first, then the sooner due date (a task with none last), then the older one."
              params: [{name: a, type: "task.Task"}, {name: b, type: "task.Task"}]
              results: [{type: "int"}]
            - name: byDue
              description: "byDue orders two tasks by due date, one with none last."
              params: [{name: a, type: "task.Task"}, {name: b, type: "task.Task"}]
              results: [{type: "int"}]
      - name: taskstore
        role: adapter
        code: 64.1.3
        uses: [planner, task, contactsapi]
        description: The tasks in the framework's store, the archiving of what was done long ago, their events on a topic, and the framework's clock.
        entities:
          - name: Record
            description: A task as the store keeps it, field for field.
            fields:
              - {name: ID, type: string, tag: 'json:"id" app:"public"'}
              - {name: OwnerID, type: string, tag: 'json:"ownerId" app:"public"'}
              - {name: SharedWith, type: "[]string", tag: 'json:"sharedWith" app:"public"'}
              - {name: Title, type: string, tag: 'json:"title" app:"public"'}
              - {name: Notes, type: string, tag: 'json:"notes" app:"public"'}
              - {name: Priority, type: string, tag: 'json:"priority" app:"public"'}
              - {name: Assignee, type: string, tag: 'json:"assignee" app:"personal,subject"'}
              - {name: Due, type: time.Time, tag: 'json:"due" app:"public"'}
              - {name: State, type: ShelfState, tag: 'json:"state" app:"public"'}
              - {name: CreatedAt, type: time.Time, tag: 'json:"createdAt" app:"public"'}
              - {name: UpdatedAt, type: time.Time, tag: 'json:"updatedAt" app:"public"'}
              - {name: DoneAt, type: time.Time, tag: 'json:"doneAt" app:"public"'}
        settings:
          - {name: archive-after, type: duration, default: 24h, description: How long a done task stays listed before it is archived.}
        workflows:
          - name: Shelf
            entity: Record
            store: tasks
            field: State
            description: What time does to a task kept, a done one is archived once archive-after has passed; its moves by a member are the use cases', which write the state they decided.
            states: [open, done, archived]
            initial: open
            transitions:
              - {event: autoArchive, from: [done], to: archived, delay: "setting:archive-after"}
            onTransition: true
        values:
          - name: Event
            description: What happened to a task, as the topic carries it to whoever listens.
            fields:
              - {name: ID, type: string, tag: 'json:"id" app:"public"', description: "ID is the event's own: a listener that is delivered it twice keys what it writes by it."}
              - {name: Kind, type: string, tag: 'json:"kind" app:"public"', description: "Kind is added, or the lifecycle event that moved the task."}
              - {name: TaskID, type: string, tag: 'json:"taskId" app:"public"'}
              - {name: OwnerID, type: string, tag: 'json:"ownerId" app:"public"'}
              - {name: Audience, type: "[]string", tag: 'json:"audience" app:"public"', description: "Audience are the members the event is told to: the task's owner and those it is shared with."}
              - {name: Title, type: string, tag: 'json:"title" app:"public"'}
              - {name: Assignee, type: string, tag: 'json:"assignee" app:"personal"'}
              - {name: At, type: time.Time, tag: 'json:"at" app:"public"'}
        topics:
          - {name: events, message: Event, description: "What happened to the tasks: one message a task added or moved, delivered at least once."}
        stores:
          - name: tasks
            entity: Record
            key: ID
            description: "Every task, keyed by its id; who it is assigned to is erased a year after it was last written."
            eraseAfter: {delay: 8760h, since: UpdatedAt}
        adapters:
          - name: Tasks
            description: Tasks is TaskStore@v1 on the store "tasks".
            implements: [tasks/port/TaskStore@v1]
          - name: Friends
            description: Friends is Circle@v1 on the contacts' query "are-contacts".
            implements: [tasks/port/Circle@v1]
          - name: Announcer
            description: Announcer is Journal@v1 on the topic "events".
            implements: [tasks/port/Journal@v1]
          - name: AppClock
            description: AppClock is Clock@v1 on the framework's clock, UTC, to the millisecond.
            implements: [tasks/port/Clock@v1]
        internals:
          functions:
            - name: toRecord
              description: "toRecord is a task as the store keeps it."
              params: [{name: t, type: "task.Task"}]
              results: [{type: "Record"}]
            - name: fromRecord
              description: "fromRecord is the task a record keeps."
              params: [{name: r, type: "Record"}]
              results: [{type: "task.Task"}]
      - name: api
        role: presentation
        code: 64.1.4
        uses: [planner, task]
        description: The HTTP API of a member's tasks, and the census the rest of the product asks.
        values:
          - name: AddRequest
            description: What a member sends to add a task.
            fields:
              - {name: Title, type: string, tag: 'json:"title" app:"public"'}
              - {name: Notes, type: string, tag: 'json:"notes" app:"public"'}
              - {name: Priority, type: string, tag: 'json:"priority" app:"public"'}
              - {name: Assignee, type: string, tag: 'json:"assignee" app:"personal"'}
              - {name: Due, type: time.Time, tag: 'json:"due" app:"public"'}
          - name: ByID
            description: The task a route names.
            fields:
              - {name: ID, type: string, tag: 'path:"id"'}
          - name: EditRequest
            description: What a member changes of a task, each field only when it is sent.
            fields:
              - {name: ID, type: string, tag: 'path:"id"'}
              - {name: Title, type: "*string", tag: 'json:"title" app:"public"'}
              - {name: Notes, type: "*string", tag: 'json:"notes" app:"public"'}
              - {name: Priority, type: "*string", tag: 'json:"priority" app:"public"'}
              - {name: Assignee, type: "*string", tag: 'json:"assignee" app:"personal"'}
              - {name: Due, type: "*time.Time", tag: 'json:"due" app:"public"'}
          - name: ShareRequest
            description: The member a task is shared with.
            fields:
              - {name: ID, type: string, tag: 'path:"id"'}
              - {name: UserID, type: string, tag: 'json:"userId" app:"public"'}
          - name: UnshareRequest
            description: The member a task is no longer shared with.
            fields:
              - {name: ID, type: string, tag: 'path:"id"'}
              - {name: UserID, type: string, tag: 'path:"userId"'}
          - name: ListRequest
            description: Which tasks to list.
            fields:
              - {name: State, type: string, tag: 'query:"state"'}
          - name: Census
            description: The tasks counted, every member's together.
            fields:
              - {name: Counts, type: "map[string]int", tag: 'json:"counts" app:"public"'}
              - {name: Total, type: int, tag: 'json:"total" app:"public"'}
              - {name: Overdue, type: int, tag: 'json:"overdue" app:"public"'}
          - name: NoInput
            description: A question that needs no word.
          - name: TaskList
            description: The tasks asked for.
            fields:
              - {name: Tasks, type: "[]task.Task", tag: 'json:"tasks"'}
        queries:
          - {name: census, input: NoInput, output: Census, handler: Count, description: "The census: how many tasks there are per state, for the components that watch the list.", uses: [tasks/usecase/CountTasks], calls: [tasks/usecase/CountTasks]}
        endpoints:
          - {route: "POST /api/tasks", request: AddRequest, response: task.Task, handler: Add, rateLimit: {perSecond: 10, burst: 20, per: client}, auth: required, uses: [tasks/usecase/AddTask], calls: [tasks/usecase/AddTask]}
          - {route: "GET /api/tasks", request: ListRequest, response: TaskList, handler: List, auth: required, uses: [tasks/usecase/ListTasks], calls: [tasks/usecase/ListTasks]}
          - {route: "GET /api/tasks/{id}", request: ByID, response: task.Task, handler: Get, auth: required, uses: [tasks/usecase/GetTask], calls: [tasks/usecase/GetTask]}
          - {route: "PATCH /api/tasks/{id}", request: EditRequest, response: task.Task, handler: Edit, auth: required, rateLimit: {perSecond: 10, burst: 20, per: client}, uses: [tasks/usecase/EditTask], calls: [tasks/usecase/EditTask]}
          - {route: "DELETE /api/tasks/{id}", request: ByID, response: NoInput, handler: Delete, auth: required, rateLimit: {perSecond: 10, burst: 20, per: client}, uses: [tasks/usecase/DeleteTask], calls: [tasks/usecase/DeleteTask]}
          - {route: "POST /api/tasks/{id}/share", request: ShareRequest, response: task.Task, handler: Share, auth: required, rateLimit: {perSecond: 10, burst: 20, per: client}, uses: [tasks/usecase/ShareTask], calls: [tasks/usecase/ShareTask]}
          - {route: "DELETE /api/tasks/{id}/share/{userId}", request: UnshareRequest, response: task.Task, handler: Unshare, auth: required, rateLimit: {perSecond: 10, burst: 20, per: client}, uses: [tasks/usecase/UnshareTask], calls: [tasks/usecase/UnshareTask]}
          - {route: "POST /api/tasks/{id}/complete", request: ByID, response: task.Task, handler: Complete, rateLimit: {perSecond: 10, burst: 20, per: client}, auth: required, uses: [tasks/usecase/MoveTask], calls: [tasks/usecase/MoveTask]}
          - {route: "POST /api/tasks/{id}/reopen", request: ByID, response: task.Task, handler: Reopen, rateLimit: {perSecond: 10, burst: 20, per: client}, auth: required, uses: [tasks/usecase/MoveTask], calls: [tasks/usecase/MoveTask]}
          - {route: "POST /api/tasks/{id}/archive", request: ByID, response: task.Task, handler: Archive, rateLimit: {perSecond: 10, burst: 20, per: client}, auth: required, uses: [tasks/usecase/MoveTask], calls: [tasks/usecase/MoveTask]}
          - {route: "POST /api/tasks/{id}/restore", request: ByID, response: task.Task, handler: Restore, rateLimit: {perSecond: 10, burst: 20, per: client}, auth: required, uses: [tasks/usecase/MoveTask], calls: [tasks/usecase/MoveTask]}
        internals:
          functions:
            - name: move
              description: "move runs MoveTask for one of the four routes that move a task."
              params: [{name: ctx, type: "context.Context"}, {name: id, type: "string"}, {name: event, type: "task.LifecycleEvent"}]
              results: [{type: "task.Task"}, {type: "error"}]
            - name: caller
              description: "caller is the member the request comes from."
              params: [{name: ctx, type: "context.Context"}]
              results: [{type: "string"}, {type: "error"}]
            - name: refusal
              description: "refusal is a use case's error as the API answers it: 404 for a task that does not exist, 409 for a move its state does not allow, 400 with the field at fault for a task that cannot be added; anything else is the framework's to answer."
              params: [{name: err, type: "error"}]
              results: [{type: "error"}]
    sequences:
      - name: complete-task
        description: A member completes a task; the feed is told.
        start: tasks/usecase/MoveTask
        steps:
          - call: tasks/port/TaskStore@v1.Get
          - call: tasks/port/Clock@v1.Now
          - call: tasks/port/TaskStore@v1.Save
          - call: tasks/port/Journal@v1.Record
