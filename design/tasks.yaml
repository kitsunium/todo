# The tasks: what a task is, what the team does with one, where they are
# kept and the HTTP API in front of them.
apiVersion: design/v2
domains:
  - name: tasks
    description: What the team has to do, who does it and by when.
    components:
      - name: task
        role: domain
        code: 64.1.1
        description: The task, its priority and its lifecycle.
        evidence: [legacy-product]
        entities:
          - name: Task
            description: Something to do, for someone, by a date.
            fields:
              - {name: ID, type: string, tag: 'json:"id" app:"public"'}
              - {name: OwnerID, type: string, tag: 'json:"ownerId" app:"public"', description: "OwnerID is the member whose task it is: who added it, shares it and deletes it."}
              - {name: SharedWith, type: "[]string", tag: 'json:"sharedWith" app:"public"', description: "SharedWith are the members the owner shares the task with: they see it, edit it and move it."}
              - {name: Title, type: string, tag: 'json:"title" app:"public"'}
              - {name: Notes, type: string, tag: 'json:"notes" app:"public"'}
              - {name: Priority, type: Priority, tag: 'json:"priority" app:"public"'}
              - {name: GroupID, type: string, tag: 'json:"groupId" app:"public"', description: "GroupID is the group whose list the task is on, empty for a personal task: every member of the group sees it, edits it and moves it."}
              - {name: AssigneeID, type: string, tag: 'json:"assigneeId" app:"personal"', description: "AssigneeID is the member who does the task, empty for none: they see it, edit it and move it."}
              - {name: Due, type: time.Time, tag: 'json:"due" app:"public"', description: "Due is when the task is due; the zero time when it has no date."}
              - {name: State, type: LifecycleState, tag: 'json:"state" app:"public"'}
              - {name: CreatedAt, type: time.Time, tag: 'json:"createdAt" app:"public"'}
              - {name: UpdatedAt, type: time.Time, tag: 'json:"updatedAt" app:"public"'}
              - {name: DoneAt, type: time.Time, tag: 'json:"doneAt" app:"public"', description: "DoneAt is when the task was last completed; the zero time while it is open."}
            methods:
              - name: SeenBy
                description: "SeenBy reports whether a member sees the task: its owner, one it is shared with, its assignee, or a member of its group, which the caller says."
                params: [{name: user, type: string}, {name: inGroup, type: bool}]
                results: [{type: bool}]
                properties: [OwnerSharedAssigneeOrMember]
              - name: Overdue
                description: Overdue reports whether the task is still open after its due date.
                params: [{name: now, type: time.Time}]
                results: [{type: bool}]
                properties: [NeverWhenDone]
        values:
          - name: Priority
            description: How urgent a task is.
            underlying: string
        constants:
          - {name: MaxTitle, type: int, value: "120", description: MaxTitle is the longest title a task takes.}
          - {name: PriorityLow, type: Priority, value: '"low"', description: PriorityLow is what can wait.}
          - {name: PriorityNormal, type: Priority, value: '"normal"', description: PriorityNormal is the priority of a task that names none.}
          - {name: PriorityHigh, type: Priority, value: '"high"', description: PriorityHigh is what comes first.}
        functions:
          - name: ParsePriority
            description: ParsePriority reads a priority as a member writes it; an empty one is normal.
            params: [{name: s, type: string}]
            results: [{type: Priority}, {type: error}]
            properties: [KnownOrRefused]
        errors:
          - {name: ErrEmptyTitle, serial: 1, message: a task needs a title}
          - {name: ErrTitleTooLong, serial: 2, message: a title is 120 characters at most}
          - {name: ErrNotFound, serial: 3, message: no such task}
          - {name: ErrUnknownPriority, serial: 4, message: "a priority is low, normal or high"}
          - {name: ErrNotAllowed, serial: 5, message: the task cannot make this move from the state it is in}
          - {name: ErrNotContact, serial: 6, message: a task is shared with a contact of its owner}
          - {name: ErrNotOwner, serial: 7, message: only its owner does this to a task}
          - {name: ErrUnknownView, serial: 8, message: "a view is inbox, today, upcoming, shared, assigned, completed or group"}
          - {name: ErrGroupNeeded, serial: 9, message: the group view needs a group}
          - {name: ErrBadZone, serial: 10, message: "a time zone is an IANA name, like Europe/Paris"}
          - {name: ErrNoGroup, serial: 11, message: no such group}
          - {name: ErrNotMember, serial: 12, message: a task goes on the list of a group its member belongs to}
          - {name: ErrNotAssignable, serial: 13, message: "a task is assigned to its owner, to a member it is shared with, or to a member of its group"}
        workflows:
          - name: Lifecycle
            entity: Task
            description: A task is open, then done, then archived; a done one reopens, an archived one is restored.
            states: [open, done, archived]
            initial: open
            transitions:
              - {event: complete, from: [open], to: done}
              - {event: reopen, from: [done], to: open}
              - {event: archive, from: [done], to: archived}
              - {event: restore, from: [archived], to: open}
      - name: planner
        role: application
        code: 64.1.2
        uses: [task]
        description: What the team does with tasks, and what that needs.
        values:
          - name: Person
            description: A member as a task names them, for a page that has no other way to.
            fields:
              - {name: ID, type: string, tag: 'json:"id" app:"public"'}
              - {name: Name, type: string, tag: 'json:"name" app:"personal"'}
        ports:
          - name: TaskStore
            direction: out
            version: 1
            description: TaskStoreV1 keeps the tasks.
            methods:
              - {name: NewID, results: [{type: string}]}
              - {name: Save, params: [{name: t, type: task.Task}]}
              - {name: Get, params: [{name: id, type: string}], results: [{type: task.Task}]}
              - {name: List, results: [{type: "[]task.Task"}]}
              - {name: Delete, params: [{name: id, type: string}]}
              - {name: Change, description: "Change applies a change to the task of an id as it is kept at that instant, alone among the writers of the store, and keeps the result; an error of the change keeps nothing.", params: [{name: id, type: string}, {name: change, type: "func(*task.Task) error"}], results: [{type: task.Task}]}
          - name: Circle
            direction: out
            version: 1
            description: CircleV1 says who is a contact of whom.
            methods:
              - {name: AreContacts, params: [{name: one, type: string}, {name: other, type: string}], results: [{type: bool}]}
          - name: Groups
            direction: out
            version: 1
            description: GroupsV1 says who belongs to which group, and what they are in it.
            methods:
              - {name: RoleOf, params: [{name: group, type: string}, {name: user, type: string}], results: [{type: string}]}
              - {name: Memberships, params: [{name: user, type: string}], results: [{type: "map[string]string"}]}
          - name: People
            direction: out
            version: 1
            description: PeopleV1 is the directory of the members, asked for a name alone.
            methods:
              - {name: ByID, params: [{name: id, type: string}], results: [{type: Person}, {type: bool}]}
          - name: Clock
            direction: out
            version: 1
            description: ClockV1 tells the time.
            methods:
              - {name: Now, results: [{type: time.Time}]}
          - name: Journal
            direction: out
            version: 1
            description: JournalV1 is told what happened to a task, for whoever keeps a feed of it.
            methods:
              - {name: Record, params: [{name: kind, type: string}, {name: t, type: task.Task}]}
              - {name: Tell, description: "Tell says what a member did to a task to one member alone: the actor and the member told are in the event.", params: [{name: kind, type: string}, {name: t, type: task.Task}, {name: actor, type: string}, {name: to, type: string}]}
              - {name: Involve, description: "Involve says to everyone who sees a task that a member brought another one into it; the actor and the member brought in are in the event.", params: [{name: kind, type: string}, {name: t, type: task.Task}, {name: actor, type: string}, {name: user, type: string}]}
        usecases:
          - name: AddTask
            description: AddTask adds an open task to its owner's list, or to the list of a group the owner belongs to, assigned or not.
            input:
              - {name: Owner, type: string}
              - {name: Title, type: string}
              - {name: Notes, type: string}
              - {name: Priority, type: string}
              - {name: GroupID, type: string}
              - {name: AssigneeID, type: string}
              - {name: Due, type: time.Time}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrEmptyTitle, task.ErrTitleTooLong, task.ErrUnknownPriority, task.ErrNotMember, task.ErrNotAssignable]
            calls: [tasks/port/Clock@v1.Now, tasks/port/Groups@v1.RoleOf, tasks/port/TaskStore@v1.NewID, tasks/port/TaskStore@v1.Save, tasks/port/Journal@v1.Record, tasks/port/Journal@v1.Tell]
            scenarios:
              - {name: adds an open task, kind: success}
              - {name: tells its assignee of a task assigned, kind: success}
              - {name: adds a task to a group list, kind: success}
              - {name: refuses an empty title, kind: refusal, error: task.ErrEmptyTitle}
              - {name: refuses a long title, kind: refusal, error: task.ErrTitleTooLong}
              - {name: refuses an unknown priority, kind: refusal, error: task.ErrUnknownPriority}
              - {name: refuses a group the member is not in, kind: refusal, error: task.ErrNotMember}
              - {name: refuses an assignee who does not see the task, kind: refusal, error: task.ErrNotAssignable}
              - {name: refuses an assignee outside the group, kind: refusal, error: task.ErrNotAssignable}
          - name: MoveTask
            description: MoveTask moves a task through its lifecycle by one event (complete, reopen, archive, restore), for a member who sees it; a task they do not see is not found.
            input:
              - {name: Owner, type: string}
              - {name: ID, type: string}
              - {name: Event, type: string}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrNotFound, task.ErrNotAllowed]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/Groups@v1.RoleOf, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.Change, tasks/port/Journal@v1.Record]
            scenarios:
              - {name: completes an open task, kind: success}
              - {name: refuses an unknown task, kind: refusal, error: task.ErrNotFound}
              - {name: refuses the task of another member, kind: refusal, error: task.ErrNotFound}
              - {name: moves a task shared with the member, kind: success}
              - {name: moves a task of a group of the member, kind: success}
              - {name: moves a task assigned to the member, kind: success}
              - {name: refuses to archive an open task, kind: refusal, error: task.ErrNotAllowed}
          - name: ListTasks
            description: "ListTasks lists the tasks a member sees, theirs, those shared with them, assigned to them and on their groups' lists, of a view (inbox, today, upcoming, shared, assigned, completed or group), of a state, or every one not archived, the most urgent first; a group narrows the list, and a time zone says when the day ends."
            input:
              - {name: Owner, type: string}
              - {name: State, type: string}
              - {name: View, type: string}
              - {name: Group, type: string}
              - {name: TZ, type: string}
            output:
              - {name: Tasks, type: "[]task.Task"}
            errors: [task.ErrUnknownView, task.ErrGroupNeeded, task.ErrBadZone, task.ErrNoGroup]
            calls: [tasks/port/Groups@v1.Memberships, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.List]
            scenarios:
              - {name: lists the most urgent first, kind: success}
              - {name: lists the tasks of a group, kind: success}
              - {name: lists a view, kind: success}
              - {name: refuses an unknown view, kind: refusal, error: task.ErrUnknownView}
              - {name: refuses the group view without a group, kind: refusal, error: task.ErrGroupNeeded}
              - {name: refuses an unknown time zone, kind: refusal, error: task.ErrBadZone}
              - {name: refuses a group the member is not in, kind: refusal, error: task.ErrNoGroup}
          - name: NamePeople
            description: NamePeople names the people of the tasks it is given, every owner, assignee and member a task is shared with, each once, in the order they first appear; the directory is asked once for each, and one it does not know is left out.
            input:
              - {name: Tasks, type: "[]task.Task"}
            output:
              - {name: People, type: "[]Person"}
            calls: [tasks/port/People@v1.ByID]
            scenarios:
              - {name: names each person once, kind: success}
              - {name: leaves out a member the directory does not know, kind: success}
              - {name: names nobody for no task, kind: success}
          - name: CountViews
            description: CountViews counts what a member's sidebar shows, the tasks left to do in each view, the overdue ones, those finished this week, and the open ones of each of their groups.
            input:
              - {name: User, type: string}
              - {name: TZ, type: string}
            output:
              - {name: Inbox, type: int}
              - {name: Today, type: int}
              - {name: Upcoming, type: int}
              - {name: Shared, type: int}
              - {name: Assigned, type: int}
              - {name: Overdue, type: int}
              - {name: CompletedThisWeek, type: int}
              - {name: Groups, type: "map[string]int"}
            errors: [task.ErrBadZone]
            calls: [tasks/port/Groups@v1.Memberships, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.List]
            scenarios:
              - {name: counts every view, kind: success}
              - {name: refuses an unknown time zone, kind: refusal, error: task.ErrBadZone}
          - name: GetTask
            description: GetTask reads one task, for a member who sees it.
            input:
              - {name: User, type: string}
              - {name: ID, type: string}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrNotFound]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/Groups@v1.RoleOf]
            scenarios:
              - {name: reads a task shared with the member, kind: success}
              - {name: reads a task of a group of the member, kind: success}
              - {name: reads a task assigned to the member, kind: success}
              - {name: refuses a task the member does not see, kind: refusal, error: task.ErrNotFound}
              - {name: refuses a group task to who left the group, kind: refusal, error: task.ErrNotFound}
          - name: EditTask
            description: EditTask changes what a task says, its title, notes, priority, assignee or due date, each only when given, for a member who sees it; an empty assignee clears it. Its owner alone moves it to another group they are in, or to none, and an assignee who is not in the new group is cleared.
            input:
              - {name: User, type: string}
              - {name: ID, type: string}
              - {name: Title, type: "*string"}
              - {name: Notes, type: "*string"}
              - {name: Priority, type: "*string"}
              - {name: AssigneeID, type: "*string"}
              - {name: GroupID, type: "*string"}
              - {name: Due, type: "*time.Time"}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrNotFound, task.ErrEmptyTitle, task.ErrTitleTooLong, task.ErrUnknownPriority, task.ErrNotAssignable, task.ErrNotOwner, task.ErrNotMember]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/Groups@v1.RoleOf, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.Change, tasks/port/Journal@v1.Record, tasks/port/Journal@v1.Tell]
            scenarios:
              - {name: changes only what is given, kind: success}
              - {name: moves a task to another group of its owner, kind: success}
              - {name: clears an assignee who is not in the new group, kind: success}
              - {name: refuses a member who moves the task, kind: refusal, error: task.ErrNotOwner}
              - {name: refuses a group its owner is not in, kind: refusal, error: task.ErrNotMember}
              - {name: assigns a member of the group, kind: success}
              - {name: assigns a member the task is shared with, kind: success}
              - {name: refuses a contact the task is not shared with, kind: refusal, error: task.ErrNotAssignable}
              - {name: clears the assignee, kind: success}
              - {name: refuses an empty title, kind: refusal, error: task.ErrEmptyTitle}
              - {name: refuses an assignee outside the group, kind: refusal, error: task.ErrNotAssignable}
          - name: DeleteTask
            description: DeleteTask deletes a task, for its owner, or for an owner or an admin of its group.
            input:
              - {name: User, type: string}
              - {name: ID, type: string}
            errors: [task.ErrNotFound, task.ErrNotOwner]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/Groups@v1.RoleOf, tasks/port/TaskStore@v1.Delete, tasks/port/Journal@v1.Record]
            scenarios:
              - {name: deletes a task of the owner, kind: success}
              - {name: deletes a task of the group as its admin, kind: success}
              - {name: refuses a member it is shared with, kind: refusal, error: task.ErrNotOwner}
              - {name: refuses a plain member of the group, kind: refusal, error: task.ErrNotOwner}
          - name: ShareTask
            description: ShareTask shares a task with a contact of its owner, who then sees it.
            input:
              - {name: User, type: string}
              - {name: ID, type: string}
              - {name: With, type: string}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrNotFound, task.ErrNotOwner, task.ErrNotContact]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/Groups@v1.RoleOf, tasks/port/Circle@v1.AreContacts, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.Change, tasks/port/Journal@v1.Involve]
            scenarios:
              - {name: shares with a contact, kind: success}
              - {name: refuses who is no contact, kind: refusal, error: task.ErrNotContact}
              - {name: refuses who is not the owner, kind: refusal, error: task.ErrNotOwner}
              - {name: refuses a member of the group who is not the owner, kind: refusal, error: task.ErrNotOwner}
          - name: UnshareTask
            description: UnshareTask ends the sharing of a task with a member, for its owner, or for that member who leaves it.
            input:
              - {name: User, type: string}
              - {name: ID, type: string}
              - {name: With, type: string}
            output:
              - {name: Task, type: task.Task}
            errors: [task.ErrNotFound, task.ErrNotOwner]
            calls: [tasks/port/TaskStore@v1.Get, tasks/port/Groups@v1.RoleOf, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.Change]
            scenarios:
              - {name: lets a member leave a task, kind: success}
              - {name: refuses a member who removes another, kind: refusal, error: task.ErrNotOwner}
          - name: FollowGroup
            description: "FollowGroup keeps the tasks consistent with a group that changed: the tasks of a deleted group go back to their owners' lists, and a task assigned to a member who is no longer in its group, and no more its owner's or shared, loses its assignee. Doing it twice changes nothing."
            input:
              - {name: Group, type: string}
              - {name: Deleted, type: bool}
            calls: [tasks/port/TaskStore@v1.List, tasks/port/TaskStore@v1.Get, tasks/port/Groups@v1.RoleOf, tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.Change]
            scenarios:
              - {name: sends the tasks of a deleted group back to their owners, kind: success}
              - {name: unassigns who left the group, kind: success}
          - name: CountTasks
            description: CountTasks counts the tasks per state, and the open ones past their due date.
            output:
              - {name: Counts, type: "map[string]int"}
              - {name: Total, type: int}
              - {name: Overdue, type: int}
            calls: [tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.List]
            scenarios:
              - {name: counts every state, kind: success}
          - name: DueSoon
            description: DueSoon lists the open tasks due within a delay, the soonest first.
            input:
              - {name: Within, type: time.Duration}
            output:
              - {name: Tasks, type: "[]task.Task"}
            calls: [tasks/port/Clock@v1.Now, tasks/port/TaskStore@v1.List]
            scenarios:
              - {name: lists the open tasks due soon, kind: success}
        internals:
          functions:
            - name: move
              description: "move fires event on t at now and stamps what the move changes: the state, UpdatedAt, and DoneAt, set when the task is completed and cleared when it opens again."
              params: [{name: ctx, type: "context.Context"}, {name: t, type: "*task.Task"}, {name: event, type: "task.LifecycleEvent"}, {name: now, type: "time.Time"}]
              results: [{type: "error"}]
            - name: rank
              description: "rank orders the priorities, the most urgent first."
              params: [{name: p, type: "task.Priority"}]
              results: [{type: "int"}]
            - name: byUrgency
              description: "byUrgency orders two tasks: the higher priority first, then the sooner due date (a task with none last), then the older one."
              params: [{name: a, type: "task.Task"}, {name: b, type: "task.Task"}]
              results: [{type: "int"}]
            - name: byDue
              description: "byDue orders two tasks by due date, one with none last."
              params: [{name: a, type: "task.Task"}, {name: b, type: "task.Task"}]
              results: [{type: "int"}]
            - name: roleIn
              description: "roleIn is the role a member has in the group a task is on: empty for a task on no group, and for a member who is in none."
              params: [{name: ctx, type: "context.Context"}, {name: groups, type: "GroupsV1"}, {name: t, type: "task.Task"}, {name: user, type: "string"}]
              results: [{type: "string"}, {type: "error"}]
            - name: load
              description: "load reads a task for a member who sees it, with the role they have in its group; a task they do not see is not found, as if there were none."
              params: [{name: ctx, type: "context.Context"}, {name: store, type: "TaskStoreV1"}, {name: groups, type: "GroupsV1"}, {name: id, type: "string"}, {name: user, type: "string"}]
              results: [{type: "task.Task"}, {type: "string"}, {type: "error"}]
            - name: manages
              description: "manages reports whether a member deletes a task: its owner, or an owner or an admin of its group, whose role is given."
              params: [{name: t, type: "task.Task"}, {name: user, type: "string"}, {name: role, type: "string"}]
              results: [{type: "bool"}]
            - name: assignable
              description: "assignable reports whether a task may be assigned to a member: its owner, a member it is shared with, or a member of its group, which the caller asked of the groups."
              params: [{name: t, type: "task.Task"}, {name: candidate, type: "string"}, {name: inGroup, type: "bool"}]
              results: [{type: "bool"}]
            - name: dayAndWeek
              description: "dayAndWeek places now in the member's time zone, an IANA name, UTC when none is given, and returns the end of their day and the start of their week, a Monday at midnight."
              params: [{name: now, type: "time.Time"}, {name: tz, type: "string"}]
              results: [{type: "time.Time"}, {type: "time.Time"}, {type: "error"}]
            - name: inView
              description: "inView reports whether a task belongs to a view for a member, the end of whose day is tomorrow, and who is or is not in the task's group."
              params: [{name: view, type: "string"}, {name: t, type: "task.Task"}, {name: user, type: "string"}, {name: inGroup, type: "bool"}, {name: tomorrow, type: "time.Time"}]
              results: [{type: "bool"}]
            - name: byCompletion
              description: "byCompletion orders the completed view: the most recently finished first."
              params: [{name: a, type: "task.Task"}, {name: b, type: "task.Task"}]
              results: [{type: "int"}]
            - name: change
              description: "change applies fn to a task a member sees, as the store holds it at that instant and alone among its writers: two changes made at once both stay."
              params: [{name: ctx, type: "context.Context"}, {name: store, type: "TaskStoreV1"}, {name: groups, type: "GroupsV1"}, {name: id, type: "string"}, {name: user, type: "string"}, {name: fn, type: "func(*task.Task, string) error"}]
              results: [{type: "task.Task"}, {type: "error"}]
      - name: taskstore
        role: adapter
        code: 64.1.3
        uses: [planner, task, contactsapi, groupsapi, groupstore, vault]
        description: The tasks in the framework's store, the archiving of what was done long ago, their events on a topic, the directory asked of the identity, and the framework's clock.
        entities:
          - name: Record
            description: A task as the store keeps it, field for field.
            fields:
              - {name: ID, type: string, tag: 'json:"id" app:"public"'}
              - {name: OwnerID, type: string, tag: 'json:"ownerId" app:"public"'}
              - {name: SharedWith, type: "[]string", tag: 'json:"sharedWith" app:"public"'}
              - {name: Title, type: string, tag: 'json:"title" app:"public"'}
              - {name: Notes, type: string, tag: 'json:"notes" app:"public"'}
              - {name: Priority, type: string, tag: 'json:"priority" app:"public"'}
              - {name: GroupID, type: string, tag: 'json:"groupId" app:"public"'}
              - {name: AssigneeID, type: string, tag: 'json:"assigneeId" app:"personal,subject"'}
              - {name: Due, type: time.Time, tag: 'json:"due" app:"public"'}
              - {name: State, type: ShelfState, tag: 'json:"state" app:"public"'}
              - {name: CreatedAt, type: time.Time, tag: 'json:"createdAt" app:"public"'}
              - {name: UpdatedAt, type: time.Time, tag: 'json:"updatedAt" app:"public"'}
              - {name: DoneAt, type: time.Time, tag: 'json:"doneAt" app:"public"'}
        settings:
          - {name: archive-after, type: duration, default: 24h, description: How long a done task stays listed before it is archived.}
        workflows:
          - name: Shelf
            entity: Record
            store: tasks
            field: State
            description: What time does to a task kept, a done one is archived once archive-after has passed; its moves by a member are the use cases', which write the state they decided.
            states: [open, done, archived]
            initial: open
            transitions:
              - {event: autoArchive, from: [done], to: archived, delay: "setting:archive-after"}
            onTransition: true
        values:
          - name: Event
            description: What happened to a task, as the topic carries it to whoever listens.
            fields:
              - {name: ID, type: string, tag: 'json:"id" app:"public"', description: "ID is the event's own: a listener that is delivered it twice keys what it writes by it."}
              - {name: Kind, type: string, tag: 'json:"kind" app:"public"', description: "Kind is added, or the lifecycle event that moved the task."}
              - {name: TaskID, type: string, tag: 'json:"taskId" app:"public"'}
              - {name: OwnerID, type: string, tag: 'json:"ownerId" app:"public"'}
              - {name: Audience, type: "[]string", tag: 'json:"audience" app:"public"', description: "Audience are the members the event is told to: the task's owner, those it is shared with, its assignee and the members of its group."}
              - {name: Title, type: string, tag: 'json:"title" app:"public"'}
              - {name: At, type: time.Time, tag: 'json:"at" app:"public"'}
              - {name: ActorID, type: string, tag: 'json:"actorId,omitempty" app:"public"', description: "ActorID is the member who did it, for an event that is about one member more than the task: shared and assigned. Empty otherwise."}
              - {name: UserID, type: string, tag: 'json:"userId,omitempty" app:"public"', description: "UserID is the member the task was shared with or assigned to. Empty otherwise."}
        topics:
          - {name: events, message: Event, description: "What happened to the tasks: one message a task added or moved, delivered at least once."}
        stores:
          - name: tasks
            entity: Record
            key: ID
            description: "Every task, keyed by its id; who it is assigned to is erased a year after it was last written."
            eraseAfter: {delay: 8760h, since: UpdatedAt}
        adapters:
          - name: Tasks
            description: Tasks is TaskStore@v1 on the store "tasks".
            implements: [tasks/port/TaskStore@v1]
          - name: Friends
            description: Friends is Circle@v1 on the contacts' query "are-contacts".
            implements: [tasks/port/Circle@v1]
          - name: Groups
            description: Groups is Groups@v1 on the groups' queries "role" and "memberships".
            implements: [tasks/port/Groups@v1]
          - name: Directory
            description: Directory is People@v1 on the identity's query "member".
            implements: [tasks/port/People@v1]
          - name: Announcer
            description: Announcer is Journal@v1 on the topic "events".
            implements: [tasks/port/Journal@v1]
          - name: AppClock
            description: AppClock is Clock@v1 on the framework's clock, UTC, to the millisecond.
            implements: [tasks/port/Clock@v1]
        subscriptions:
          - {name: groups, topic: groups/topic/events, handler: FollowGroups, description: "A group deleted, or a member who left it or was removed from it: the tasks follow.", uses: [tasks/usecase/FollowGroup], calls: [tasks/usecase/FollowGroup]}
        internals:
          functions:
            - name: toRecord
              description: "toRecord is a task as the store keeps it."
              params: [{name: t, type: "task.Task"}]
              results: [{type: "Record"}]
            - name: fromRecord
              description: "fromRecord is the task a record keeps."
              params: [{name: r, type: "Record"}]
              results: [{type: "task.Task"}]
            - name: audienceOf
              description: "audienceOf is everyone who sees a task: its owner, the members it is shared with, its assignee, and the members of its group, the groups' query \"members\" naming them; each once, the owner first."
              params: [{name: ctx, type: "context.Context"}, {name: t, type: "task.Task"}]
              results: [{type: "[]string"}, {type: "error"}]
      - name: api
        role: presentation
        code: 64.1.4
        uses: [planner, task, feed]
        description: The HTTP API of a member's tasks, and the census the rest of the product asks.
        values:
          - name: AddRequest
            description: What a member sends to add a task.
            fields:
              - {name: Title, type: string, tag: 'json:"title" app:"public"'}
              - {name: Notes, type: string, tag: 'json:"notes" app:"public"'}
              - {name: Priority, type: string, tag: 'json:"priority" app:"public"'}
              - {name: GroupID, type: string, tag: 'json:"groupId" app:"public"'}
              - {name: AssigneeID, type: string, tag: 'json:"assigneeId" app:"personal"'}
              - {name: Due, type: time.Time, tag: 'json:"due" app:"public"'}
          - name: ByID
            description: The task a route names.
            fields:
              - {name: ID, type: string, tag: 'path:"id"'}
          - name: EditRequest
            description: What a member changes of a task, each field only when it is sent.
            fields:
              - {name: ID, type: string, tag: 'path:"id"'}
              - {name: Title, type: "*string", tag: 'json:"title" app:"public"'}
              - {name: Notes, type: "*string", tag: 'json:"notes" app:"public"'}
              - {name: Priority, type: "*string", tag: 'json:"priority" app:"public"'}
              - {name: AssigneeID, type: "*string", tag: 'json:"assigneeId" app:"personal"'}
              - {name: GroupID, type: "*string", tag: 'json:"groupId" app:"public"'}
              - {name: Due, type: "*time.Time", tag: 'json:"due" app:"public"'}
          - name: ShareRequest
            description: The member a task is shared with.
            fields:
              - {name: ID, type: string, tag: 'path:"id"'}
              - {name: UserID, type: string, tag: 'json:"userId" app:"public"'}
          - name: UnshareRequest
            description: The member a task is no longer shared with.
            fields:
              - {name: ID, type: string, tag: 'path:"id"'}
              - {name: UserID, type: string, tag: 'path:"userId"'}
          - name: ListRequest
            description: Which tasks to list.
            fields:
              - {name: State, type: string, tag: 'query:"state"'}
              - {name: View, type: string, tag: 'query:"view"'}
              - {name: Group, type: string, tag: 'query:"group"'}
              - {name: TZ, type: string, tag: 'query:"tz"'}
          - name: CountsRequest
            description: Whose views to count, in which time zone.
            fields:
              - {name: TZ, type: string, tag: 'query:"tz"'}
          - name: ViewCounts
            description: What a member's sidebar counts.
            fields:
              - {name: Inbox, type: int, tag: 'json:"inbox" app:"public"'}
              - {name: Today, type: int, tag: 'json:"today" app:"public"'}
              - {name: Upcoming, type: int, tag: 'json:"upcoming" app:"public"'}
              - {name: Shared, type: int, tag: 'json:"shared" app:"public"'}
              - {name: Assigned, type: int, tag: 'json:"assigned" app:"public"'}
              - {name: Unread, type: int, tag: 'json:"unread" app:"public"', description: "Unread is how many entries of the member's activity feed are not read yet, asked of the feed."}
              - {name: Overdue, type: int, tag: 'json:"overdue" app:"public"'}
              - {name: CompletedThisWeek, type: int, tag: 'json:"completedThisWeek" app:"public"'}
              - {name: Groups, type: "map[string]int", tag: 'json:"groups" app:"public"'}
          - name: Census
            description: The tasks counted, every member's together.
            fields:
              - {name: Counts, type: "map[string]int", tag: 'json:"counts" app:"public"'}
              - {name: Total, type: int, tag: 'json:"total" app:"public"'}
              - {name: Overdue, type: int, tag: 'json:"overdue" app:"public"'}
          - name: NoInput
            description: A question that needs no word.
          - name: TaskView
            description: A task as it is answered, with the names of its people.
            fields:
              - {embedded: true, type: task.Task}
              - {name: People, type: "[]planner.Person", tag: 'json:"people"', description: "People names the owner, the assignee and the members the task is shared with, each once."}
          - name: TaskList
            description: The tasks asked for, with the names of their people.
            fields:
              - {name: Tasks, type: "[]task.Task", tag: 'json:"tasks"'}
              - {name: People, type: "[]planner.Person", tag: 'json:"people"', description: "People names every owner, assignee and member any of the tasks is shared with, each once."}
        queries:
          - {name: census, input: NoInput, output: Census, handler: Count, description: "The census: how many tasks there are per state, for the components that watch the list.", uses: [tasks/usecase/CountTasks], calls: [tasks/usecase/CountTasks]}
        endpoints:
          - {route: "POST /api/tasks", request: AddRequest, response: TaskView, handler: Add, rateLimit: {perSecond: 10, burst: 20, per: client}, auth: required, uses: [tasks/usecase/AddTask, tasks/usecase/NamePeople], calls: [tasks/usecase/AddTask, tasks/usecase/NamePeople]}
          - {route: "GET /api/tasks", request: ListRequest, response: TaskList, handler: List, auth: required, uses: [tasks/usecase/ListTasks, tasks/usecase/NamePeople], calls: [tasks/usecase/ListTasks, tasks/usecase/NamePeople]}
          - {route: "GET /api/tasks/counts", request: CountsRequest, response: ViewCounts, handler: Counts, auth: required, uses: [tasks/usecase/CountViews], calls: [tasks/usecase/CountViews]}
          - {route: "GET /api/tasks/{id}", request: ByID, response: TaskView, handler: Get, auth: required, uses: [tasks/usecase/GetTask, tasks/usecase/NamePeople], calls: [tasks/usecase/GetTask, tasks/usecase/NamePeople]}
          - {route: "PATCH /api/tasks/{id}", request: EditRequest, response: TaskView, handler: Edit, auth: required, rateLimit: {perSecond: 10, burst: 20, per: client}, uses: [tasks/usecase/EditTask, tasks/usecase/NamePeople], calls: [tasks/usecase/EditTask, tasks/usecase/NamePeople]}
          - {route: "DELETE /api/tasks/{id}", request: ByID, response: NoInput, handler: Delete, auth: required, rateLimit: {perSecond: 10, burst: 20, per: client}, uses: [tasks/usecase/DeleteTask], calls: [tasks/usecase/DeleteTask]}
          - {route: "POST /api/tasks/{id}/share", request: ShareRequest, response: TaskView, handler: Share, auth: required, rateLimit: {perSecond: 10, burst: 20, per: client}, uses: [tasks/usecase/ShareTask, tasks/usecase/NamePeople], calls: [tasks/usecase/ShareTask, tasks/usecase/NamePeople]}
          - {route: "DELETE /api/tasks/{id}/share/{userId}", request: UnshareRequest, response: TaskView, handler: Unshare, auth: required, rateLimit: {perSecond: 10, burst: 20, per: client}, uses: [tasks/usecase/UnshareTask, tasks/usecase/NamePeople], calls: [tasks/usecase/UnshareTask, tasks/usecase/NamePeople]}
          - {route: "POST /api/tasks/{id}/complete", request: ByID, response: TaskView, handler: Complete, rateLimit: {perSecond: 10, burst: 20, per: client}, auth: required, uses: [tasks/usecase/MoveTask, tasks/usecase/NamePeople], calls: [tasks/usecase/MoveTask, tasks/usecase/NamePeople]}
          - {route: "POST /api/tasks/{id}/reopen", request: ByID, response: TaskView, handler: Reopen, rateLimit: {perSecond: 10, burst: 20, per: client}, auth: required, uses: [tasks/usecase/MoveTask, tasks/usecase/NamePeople], calls: [tasks/usecase/MoveTask, tasks/usecase/NamePeople]}
          - {route: "POST /api/tasks/{id}/archive", request: ByID, response: TaskView, handler: Archive, rateLimit: {perSecond: 10, burst: 20, per: client}, auth: required, uses: [tasks/usecase/MoveTask, tasks/usecase/NamePeople], calls: [tasks/usecase/MoveTask, tasks/usecase/NamePeople]}
          - {route: "POST /api/tasks/{id}/restore", request: ByID, response: TaskView, handler: Restore, rateLimit: {perSecond: 10, burst: 20, per: client}, auth: required, uses: [tasks/usecase/MoveTask, tasks/usecase/NamePeople], calls: [tasks/usecase/MoveTask, tasks/usecase/NamePeople]}
        internals:
          functions:
            - name: move
              description: "move runs MoveTask for one of the four routes that move a task, and answers the task with its people."
              params: [{name: ctx, type: "context.Context"}, {name: id, type: "string"}, {name: event, type: "task.LifecycleEvent"}]
              results: [{type: "TaskView"}, {type: "error"}]
            - name: caller
              description: "caller is the member the request comes from."
              params: [{name: ctx, type: "context.Context"}]
              results: [{type: "string"}, {type: "error"}]
            - name: refusal
              description: "refusal is a use case's error as the API answers it: 404 for a task that does not exist, 409 for a move its state does not allow, 400 with the field at fault for a task that cannot be added; anything else is the framework's to answer."
              params: [{name: err, type: "error"}]
              results: [{type: "error"}]
            - name: viewOf
              description: "viewOf is a task as it is answered: with the names of its people, asked of the directory once for each."
              params: [{name: ctx, type: "context.Context"}, {name: t, type: "task.Task"}]
              results: [{type: "TaskView"}, {type: "error"}]
    sequences:
      - name: complete-task
        description: A member completes a task; the feed is told.
        start: tasks/usecase/MoveTask
        steps:
          - call: tasks/port/Clock@v1.Now
          - call: tasks/port/TaskStore@v1.Get
          - call: tasks/port/Groups@v1.RoleOf
          - call: tasks/port/TaskStore@v1.Change
          - call: tasks/port/Journal@v1.Record
